x-autoware-base: &autoware-base
  image: "aichallenge-2025-dev"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    - HOME=/tmp
    - DISPLAY=${DISPLAY:-}
    - USER=${USER}
    - ROS_DISTRO=humble
    - XAUTHORITY=${XAUTHORITY:-}
    - QT_X11_NO_MITSHM=1
    - TZ=Asia/Tokyo
    - RUN_MODE=${RUN_MODE:-}
    - SIM_MODE=${SIM_MODE:-}
    # 複数のシミュレータを同時に走らせるためのスロット指定。既定は空で、
    # simulator_scripts 側が 0 とみなすので通常の実験の条件は変わらない。
    - ROS2_BASE_DOMAIN=${ROS2_BASE_DOMAIN:-}
    - AWSIM_ADMIN_DOMAIN=${AWSIM_ADMIN_DOMAIN:-}
    - AWSIM_HEADLESS=${AWSIM_HEADLESS:-}
    - CMD=${CMD:-}
    - COLCON_TRACE=${COLCON_TRACE:-}
    - ROS_HOME=${ROS_HOME:-}
    - ROS_LOG_DIR=${ROS_LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - LOG_DIR=${LOG_DIR:-}
    # 同一レース内で新旧の設定を比べるための、車ごとの上書き(A/B用)。
    # 未設定なら launch 側の既定値が使われるので、通常の実験の条件は変わらない。
    - LEADER_PASS_LAST_LAPS=${LEADER_PASS_LAST_LAPS:-0}
    - ZONE_FALLBACK=${ZONE_FALLBACK:-false}
    # 公式オーバーテイクレーン(SIM決勝)。既定は無効。A/B で確かめてから入れる。
    - WALL_FWD_BAN=${WALL_FWD_BAN:-true}
    - WALL_FWD_BAN_HOLD=${WALL_FWD_BAN_HOLD:-0.8}
    - WALL_STALL_SEC=${WALL_STALL_SEC:-1.5}
    - STOP_AVOID_FIX=${STOP_AVOID_FIX:-true}
    - LATCH_HARD=${LATCH_HARD:-false}
    - REAR_END_BRAKE_K=${REAR_END_BRAKE_K:-0.22}
    - OT_LANE_GUARD_ON=${OT_LANE_GUARD_ON:-true}
    - OT_LANE=${OT_LANE:-false}
    - OT_LANE_ZONES=${OT_LANE_ZONES:-234:21}
    - OT_LANE_MIN=${OT_LANE_MIN:-28.0}
    - OT_LANE_GUARD=${OT_LANE_GUARD:-2.0}
    - OT_LANE_SIDE=${OT_LANE_SIDE:-true}
    - OT_LANE_PREP=${OT_LANE_PREP:-true}
    - OT_LANE_PREP_LOOK=${OT_LANE_PREP_LOOK:-18.0}
    - OT_LANE_PREP_TIME=${OT_LANE_PREP_TIME:-0.8}
    - OT_LANE_INSET=${OT_LANE_INSET:-0.35}
    - BODY_ASYM=${BODY_ASYM:-true}
    - HOLD_ALONGSIDE=${HOLD_ALONGSIDE:-true}
    - WALL_BODY_SPAN=${WALL_BODY_SPAN:-true}
    - OT_LANE_USE=${OT_LANE_USE:-239:17}
    - OPP_MODEL=${OPP_MODEL:-true}
    - SPOT_ALL=${SPOT_ALL:-true}
    - NO_PASS_ZONES=${NO_PASS_ZONES:-18:30,89:95}
    - SPOT_ENTRY_GAP=${SPOT_ENTRY_GAP:--1.0}
    - SPOT_PASS_LEN_GAIN=${SPOT_PASS_LEN_GAIN:-1.0}
    - SPOT_NEED_MARGIN=${SPOT_NEED_MARGIN:-1.15}
    - REAR_END_FREE_MIN=${REAR_END_FREE_MIN:-1.66}
    - ATTEMPT_LAT_HOLD=${ATTEMPT_LAT_HOLD:-false}
    - SIDE_FIX=${SIDE_FIX:-false}
    - RECOVERY_FIX=${RECOVERY_FIX:-false}
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
    - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices:
    - /dev/dri
    - /dev/video0
    - /dev/input
  group_add:
    # Read /dev/input/event* (joy_node/SDL2) as non-root user. GID from host `input` group.
    - "${HOST_GID_INPUT:-104}"
  working_dir: /aichallenge

x-autoware-rosbag-base: &autoware-rosbag-base
  <<: *autoware-base
  stop_grace_period: 60s
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - ${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:ro
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # No audio mount: rosbag recording needs no PulseAudio.
    - /dev/dri:/dev/dri
    - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw

x-racing_kart_interface-base: &racing_kart_interface-base
  image: "ghcr.io/tier4/racing_kart_interface:latest-experiment"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    - HOME=/tmp
    - DISPLAY=${DISPLAY:-}
    - USER=${USER}
    - TZ=Asia/Tokyo
    - ROS_DISTRO=humble
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - LOG_DIR=${LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - NTRIP_USERNAME=${NTRIP_USERNAME:-}
    - NTRIP_PASSWORD=${NTRIP_PASSWORD:-}
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./vehicle:/vehicle:ro
    - ./aichallenge/utils:/aichallenge/utils:ro
    - /dev/vcu:/dev/vcu
    - /dev/gnss:/dev/gnss
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices:
    - /dev/dri
  group_add:
    - "${HOST_GID_DIALOUT:-20}"
  working_dir: /workspace

services:
  # Autoware service
  autoware:
    <<: *autoware-base
    command: ["bash", "-lc", "exec /aichallenge/run_autoware.bash ${RUN_MODE:-awsim} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # Autoware service
  autoware-build:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/build_autoware.bash ${HOST_UID:-} ${HOST_GID:-}"]

  simulator:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/run_simulator.bash"]

  autoware-command:
    <<: *autoware-base
    command: ["bash", "-lc", "cd ${CMD_WORKDIR:-/aichallenge} && exec bash -lc \"${CMD:-}\""]

  rosbag:
    <<: *autoware-rosbag-base
    command: ["bash", "-lc", 'exec /aichallenge/utils/record_all_rosbag.bash "${ROS_DOMAIN_ID:-1}" "${LOG_DIR:-}" "${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}"']

  autoware-simulator-evaluation:
    <<: *autoware-base
    image: "aichallenge-2025-eval"
    # /aichallenge is baked into the eval image; intentionally not mounted here.
    volumes:
      - ./output:${OUTPUT_ROOT:-/output}
      - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    command: ["bash", "-lc", "exec /aichallenge/run_evaluation.bash"]

#### vehicle specific services can be added here ####
  # Zenoh service
  zenoh:
    <<: *autoware-base
    working_dir: /vehicle
    command: ["bash", "-lc", "exec /vehicle/run_zenoh.bash ${VEHICLE_ID:-} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # Driver service
  driver:
    <<: *racing_kart_interface-base
    # Start as root for CAN/DDS host setup; /vehicle/run_driver.bash
    # fixes log ownership back to HOST_UID:HOST_GID.
    user: "root"
    entrypoint: []
    command: ["bash", "-lc", "exec /vehicle/run_driver.bash vehicle ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

#### remote visualization services ####
  rviz2:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/utils/run_rviz.bash remote"]
