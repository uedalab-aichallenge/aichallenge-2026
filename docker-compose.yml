x-autoware-base: &autoware-base
  image: "aichallenge-2025-dev"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    - HOME=/tmp
    - DISPLAY=${DISPLAY:-}
    - USER=${USER}
    - ROS_DISTRO=humble
    - XAUTHORITY=${XAUTHORITY:-}
    - QT_X11_NO_MITSHM=1
    - TZ=Asia/Tokyo
    - RUN_MODE=${RUN_MODE:-}
    - SIM_MODE=${SIM_MODE:-}
    # 複数のシミュレータを同時に走らせるためのスロット指定。既定は空で、
    # simulator_scripts 側が 0 とみなすので通常の実験の条件は変わらない。
    - ROS2_BASE_DOMAIN=${ROS2_BASE_DOMAIN:-}
    - AWSIM_ADMIN_DOMAIN=${AWSIM_ADMIN_DOMAIN:-}
    - AWSIM_HEADLESS=${AWSIM_HEADLESS:-}
    - CMD=${CMD:-}
    - COLCON_TRACE=${COLCON_TRACE:-}
    - ROS_HOME=${ROS_HOME:-}
    - ROS_LOG_DIR=${ROS_LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - LOG_DIR=${LOG_DIR:-}
    # 同一レース内で新旧の設定を比べるための、車ごとの上書き(A/B用)。
    # 未設定なら launch 側の既定値が使われるので、通常の実験の条件は変わらない。
    - LEADER_PASS_LAST_LAPS=${LEADER_PASS_LAST_LAPS:-0}
    - ZONE_FALLBACK=${ZONE_FALLBACK:-false}
    # 直線での側の選択。
    - LAT_PRED_MODE=${LAT_PRED_MODE:-1}
    - SIDE_ZONE_END_CLAMP=${SIDE_ZONE_END_CLAMP:-true}
    - SIDE_PLAN_FULL_SCALE=${SIDE_PLAN_FULL_SCALE:-true}
    - PASS_NEED_ROOM_M=${PASS_NEED_ROOM_M:-0.30}
    - SIDE_ZONE_GEOM_DEFAULT=${SIDE_ZONE_GEOM_DEFAULT:-false}
    - RUNUP_USE_PLAN=${RUNUP_USE_PLAN:-true}
    - QWAIT_MAX_STOPPED=${QWAIT_MAX_STOPPED:-4.0}
    - QWAIT_FRONT_ONLY=${QWAIT_FRONT_ONLY:-true}
    - DEADLOCK_RELEASE=${DEADLOCK_RELEASE:-false}
    - DEADLOCK_RELEASE_SEC=${DEADLOCK_RELEASE_SEC:-5.0}
    - RECOVERY_SPEED=${RECOVERY_SPEED:-4.0}
    - RECOVERY_ACCEL=${RECOVERY_ACCEL:-1.37}
    - NO_PLAN_RETRY_SEC=${NO_PLAN_RETRY_SEC:-0.10}
    - PHASE_MIN_SEC=${PHASE_MIN_SEC:-0.6}
    - STOPPED_BOX_ENABLE=${STOPPED_BOX_ENABLE:-true}
    - STOPPED_BAND_EDGE=${STOPPED_BAND_EDGE:-true}
    - REACHABLE_GUARD_ESCAPE=${REACHABLE_GUARD_ESCAPE:-true}
    - REACHABLE_LAT_CLAMP=${REACHABLE_LAT_CLAMP:-true}
    - SIDE_DEFAULT_BY_ROOM=${SIDE_DEFAULT_BY_ROOM:-true}
    - ESCAPE_PROBE=${ESCAPE_PROBE:-false}
    - RUNUP_BOOST_ACCEL=${RUNUP_BOOST_ACCEL:-true}
    - PASS_DIST_ACCEL=${PASS_DIST_ACCEL:-true}
    - PASS_BOOST_GATE=${PASS_BOOST_GATE:-true}
    - OCCUPIED_REAL_WIDTH=${OCCUPIED_REAL_WIDTH:-true}
    - OCCUPIED_YAW_PAD=${OCCUPIED_YAW_PAD:-true}
    - BODY_CURVE_PAD=${BODY_CURVE_PAD:-true}
    - SIDE_MEANLAT_LIVE=${SIDE_MEANLAT_LIVE:-true}
    - SIDE_FALLBACK_ROOM=${SIDE_FALLBACK_ROOM:-true}
    - SEP_FLOOR_ENABLE=${SEP_FLOOR_ENABLE:-true}
    - OT_LANE_RUNUP=${OT_LANE_RUNUP:-true}
    - GATE_RUNUP_CHARGE=${GATE_RUNUP_CHARGE:-true}
    - BOOST_ONLY_IF_DECISIVE=${BOOST_ONLY_IF_DECISIVE:-true}
    - STOPPED_AIM_EDGE=${STOPPED_AIM_EDGE:-true}
    - STOP_CREEP_BY_BAND=${STOP_CREEP_BY_BAND:-true}
    - OT_LANE_AIM=${OT_LANE_AIM:-true}
    - RUNUP_GAP_HOLD=${RUNUP_GAP_HOLD:-true}
    - STOPPED_KEEP_PASS_EXCLUDE=${STOPPED_KEEP_PASS_EXCLUDE:-false}
    - GATE_RUNUP_SIDESTEP=${GATE_RUNUP_SIDESTEP:-true}
    - SIZE_PAD=${SIZE_PAD:-0.12}
    - STOPPED_PAD_RELAX=${STOPPED_PAD_RELAX:-true}
    - REAR_END_NEAR=${REAR_END_NEAR:-4.5}
    - BAND_CAR_W=${BAND_CAR_W:-1.55}
    - PASS_FINISH_ABORT=${PASS_FINISH_ABORT:-true}
    - STEER_CLAMP_TEST=${STEER_CLAMP_TEST:-0.0}
    - LOOKAHEAD_CURVE_ALWAYS=${LOOKAHEAD_CURVE_ALWAYS:-false}
    - LOOKAHEAD_GAIN=${LOOKAHEAD_GAIN:-0.20}
    - STEER_GAIN=${STEER_GAIN:-2.8}
    - LOOKAHEAD_CURVE_MIN=${LOOKAHEAD_CURVE_MIN:-2.8}
    - LOOKAHEAD_CURVE_MAX=${LOOKAHEAD_CURVE_MAX:-6.0}
    - LOOKAHEAD_CURVE_K=${LOOKAHEAD_CURVE_K:-0.35}
    - PASS_FINISH_NO_START=${PASS_FINISH_NO_START:-true}
    - LAUNCH_NO_RECOVERY_SEC=${LAUNCH_NO_RECOVERY_SEC:-8.0}
    # 公式オーバーテイクレーン(SIM決勝)。既定は無効。A/B で確かめてから入れる。
    - WALL_FWD_BAN=${WALL_FWD_BAN:-true}
    - WALL_FWD_BAN_HOLD=${WALL_FWD_BAN_HOLD:-0.8}
    - STOP_AVOID_FIX=${STOP_AVOID_FIX:-true}
    - LATCH_HARD=${LATCH_HARD:-false}
    - REAR_END_BRAKE_K=${REAR_END_BRAKE_K:-0.22}
    - OT_LANE_GUARD_ON=${OT_LANE_GUARD_ON:-true}
    - OT_LANE=${OT_LANE:-true}
    - OT_LANE_ZONES=${OT_LANE_ZONES:-234:21}
    - OT_LANE_MIN=${OT_LANE_MIN:-28.0}
    - OT_LANE_GUARD=${OT_LANE_GUARD:-2.0}
    - OT_LANE_SIDE=${OT_LANE_SIDE:-true}
    - OT_LANE_PREP=${OT_LANE_PREP:-true}
    - OT_LANE_PREP_LOOK=${OT_LANE_PREP_LOOK:-18.0}
    - OT_LANE_PREP_TIME=${OT_LANE_PREP_TIME:-0.8}
    - OT_LANE_INSET=${OT_LANE_INSET:-0.35}
    - OT_LANE_STICKY=${OT_LANE_STICKY:-true}
    - SIDE_HOLD=${SIDE_HOLD:-false}
    - ATTEMPT_GIVEUP=${ATTEMPT_GIVEUP:-0.0}
    - OT_LANE_GUARD_GEOM=${OT_LANE_GUARD_GEOM:-true}
    - OT_LANE_OVER_SPOT=${OT_LANE_OVER_SPOT:-true}
    - OT_LANE_TOUCH_MARGIN=${OT_LANE_TOUCH_MARGIN:-0.15}
    - BODY_ASYM=${BODY_ASYM:-true}
    - HOLD_ALONGSIDE=${HOLD_ALONGSIDE:-true}
    - WALL_BODY_SPAN=${WALL_BODY_SPAN:-true}
    - OT_LANE_USE=${OT_LANE_USE:-239:17}
    - OPP_MODEL=${OPP_MODEL:-true}
    - SPOT_ALL=${SPOT_ALL:-true}
    # 録画なしで接近準備(PREPARE)に入るか。車ごと A/B のため compose 経由で渡す。
    - PREP_FREE=${PREP_FREE:-true}
    - PREP_GAP=${PREP_GAP:-20.0}
    # 復帰の最終手段。車ごと A/B のため compose 経由で渡す。
    - DESPERATE=${DESPERATE:-true}
    - EMBED_MIN_REV=${EMBED_MIN_REV:-0.20}
    - PLAN_STEER_KICK=${PLAN_STEER_KICK:-true}
    - PLAN_STEER_KICK_M=${PLAN_STEER_KICK_M:-1.0}
    - CONTACT_LEASE=${CONTACT_LEASE:-false}
    - EMBED_FORWARD_ESCAPE=${EMBED_FORWARD_ESCAPE:-true}
    - GUARD_TRUST_CERT=${GUARD_TRUST_CERT:-true}
    - STEER_CLAMP_ALL=${STEER_CLAMP_ALL:-true}
    - SAT_ACCEL_GUARD=${SAT_ACCEL_GUARD:-true}
    - FREE_BOOST=${FREE_BOOST:-false}
    - RUNUP_GAP_CAP=${RUNUP_GAP_CAP:-true}
    - RUNUP_GAP_OPEN=${RUNUP_GAP_OPEN:-true}
    - PRE_POS_SEP=${PRE_POS_SEP:-true}
    - PRE_POS_PASSOK=${PRE_POS_PASSOK:-false}
    - RUNUP_GAP_OPEN_CMD=${RUNUP_GAP_OPEN_CMD:-true}
    - RUNUP_CHARGE_RELAX=${RUNUP_CHARGE_RELAX:-true}
    - LANE_RUNUP_LOOK=${LANE_RUNUP_LOOK:-28.0}
    - LANE_WIN_SAFETY=${LANE_WIN_SAFETY:-0.15}
    - LANE_AIM_SEEK=${LANE_AIM_SEEK:-true}
    - PASS_GAP_MARGIN=${PASS_GAP_MARGIN:-0.10}
    - PASS_WALL_KEEP=${PASS_WALL_KEEP:-0.25}
    - BODY_GUARD=${BODY_GUARD:-true}
    - BODY_GUARD_REACT=${BODY_GUARD_REACT:-0.0}
    - BODY_GUARD_HARD=${BODY_GUARD_HARD:-0.35}
    - BODY_GUARD_CAP=${BODY_GUARD_CAP:-20.0}
    - PRE_IN_PREPARE=${PRE_IN_PREPARE:-false}
    - OFFSET_RATE=${OFFSET_RATE:-1.2}
    - RUNUP_ACCEL_MPS2=${RUNUP_ACCEL_MPS2:-3.2}
    - START_GAP_REAREND=${START_GAP_REAREND:-true}
    - REAR_TARGET_RELEASE=${REAR_TARGET_RELEASE:-false}
    - REAR_LAT_PLAN=${REAR_LAT_PLAN:-true}
    - PASS_GAP_CLEAR=${PASS_GAP_CLEAR:-1.0}
    - PREDICT_ALL=${PREDICT_ALL:-true}
    - GATE_SIDESTEP_AFTER_MERGE=${GATE_SIDESTEP_AFTER_MERGE:-true}
    - LANE_RUNUP_MARGIN=${LANE_RUNUP_MARGIN:-3.5}
    - RUNUP_GATE_SLACK=${RUNUP_GATE_SLACK:-1.0}
    - RUNUP_FUEL=${RUNUP_FUEL:-true}
    - SIM_OPP_MODEL=${SIM_OPP_MODEL:-true}
    - OPP_ACCEL=${OPP_ACCEL:-0.8}
    - GATE_IN_LANE=${GATE_IN_LANE:-true}
    - RUNUP_SIM=${RUNUP_SIM:-true}
    - LANE_ENTRY_PRE=${LANE_ENTRY_PRE:-3.0}
    - GATE_REF_GATE=${GATE_REF_GATE:-true}
    - RUNUP_FUEL_BODY=${RUNUP_FUEL_BODY:-true}
    - REAR_SEP_TRUE=${REAR_SEP_TRUE:-true}
    - NORMAL_GAP_REAREND=${NORMAL_GAP_REAREND:-true}
    - GATE_TARGET_GATE=${GATE_TARGET_GATE:-false}
    - GATE_LATE=${GATE_LATE:-false}
    - QWAIT_MOVING=${QWAIT_MOVING:-false}
    - PASS_BESIDE_SEP=${PASS_BESIDE_SEP:-1.45}
    - BAND_SIDE_LEAD=${BAND_SIDE_LEAD:-false}
    - SIDE_MODEL_FILL=${SIDE_MODEL_FILL:-true}
    - SIDE_PICK_RUN=${SIDE_PICK_RUN:-false}
    - CURVE_SIDE=${CURVE_SIDE:-true}
    - SIDE_ZONE_REPICK=${SIDE_ZONE_REPICK:-false}
    - SIDE_ZONE_MEAN_SPLIT=${SIDE_ZONE_MEAN_SPLIT:-false}
    - SLOW_RIVAL_BY_TOP=${SLOW_RIVAL_BY_TOP:-false}
    - SLOW_RIVAL_RECENT=${SLOW_RIVAL_RECENT:-false}
    - REV_CMD_HOLD_SEC=${REV_CMD_HOLD_SEC:-0.5}
    - REV_GEAR_FIX=${REV_GEAR_FIX:-false}
    - ZONE_FREE=${ZONE_FREE:-false}
    - SPOT_W_REF=${SPOT_W_REF:-false}
    - SPOT_W_REF_MIN=${SPOT_W_REF_MIN:-0.25}
    - CURVE_SIDE_IN_ZONE=${CURVE_SIDE_IN_ZONE:-true}
    - SIDE_PICK_ZONES=${SIDE_PICK_ZONES:-232:241,0:20}
    - NO_PASS_ZONES=${NO_PASS_ZONES:-18:30,89:95}
    - SPOT_ENTRY_GAP=${SPOT_ENTRY_GAP:--1.0}
    - SPOT_PASS_LEN_GAIN=${SPOT_PASS_LEN_GAIN:-1.0}
    - SPOT_NEED_MARGIN=${SPOT_NEED_MARGIN:-1.15}
    - REAR_END_FREE_MIN=${REAR_END_FREE_MIN:-1.45}
    - ATTEMPT_LAT_HOLD=${ATTEMPT_LAT_HOLD:-false}
    - SIDE_FIX=${SIDE_FIX:-false}
    - RECOVERY_FIX=${RECOVERY_FIX:-false}
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
    - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices:
    - /dev/dri
    - /dev/video0
    - /dev/input
  group_add:
    # Read /dev/input/event* (joy_node/SDL2) as non-root user. GID from host `input` group.
    - "${HOST_GID_INPUT:-104}"
  working_dir: /aichallenge

x-autoware-rosbag-base: &autoware-rosbag-base
  <<: *autoware-base
  stop_grace_period: 60s
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./aichallenge:/aichallenge
    - ./remote:/remote
    - ./vehicle:/vehicle
    - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
    - ${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}:ro
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # No audio mount: rosbag recording needs no PulseAudio.
    - /dev/dri:/dev/dri
    - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw

x-racing_kart_interface-base: &racing_kart_interface-base
  image: "ghcr.io/tier4/racing_kart_interface:latest-experiment"
  privileged: true
  pull_policy: never
  network_mode: host
  stop_grace_period: 10s
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    - HOME=/tmp
    - DISPLAY=${DISPLAY:-}
    - USER=${USER}
    - TZ=Asia/Tokyo
    - ROS_DISTRO=humble
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
    - LOG_DIR=${LOG_DIR:-}
    - HOST_UID=${HOST_UID:-}
    - HOST_GID=${HOST_GID:-}
    - NTRIP_USERNAME=${NTRIP_USERNAME:-}
    - NTRIP_PASSWORD=${NTRIP_PASSWORD:-}
  volumes:
    - ./output:${OUTPUT_ROOT:-/output}
    - ./vehicle:/vehicle:ro
    - ./aichallenge/utils:/aichallenge/utils:ro
    - /dev/vcu:/dev/vcu
    - /dev/gnss:/dev/gnss
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/dri:/dev/dri
    - /etc/passwd:/etc/passwd:ro
    - /etc/group:/etc/group:ro
  devices:
    - /dev/dri
  group_add:
    - "${HOST_GID_DIALOUT:-20}"
  working_dir: /workspace

services:
  # Autoware service
  autoware:
    <<: *autoware-base
    command: ["bash", "-lc", "exec /aichallenge/run_autoware.bash ${RUN_MODE:-awsim} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # Autoware service
  autoware-build:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/build_autoware.bash ${HOST_UID:-} ${HOST_GID:-}"]

  simulator:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/run_simulator.bash"]

  autoware-command:
    <<: *autoware-base
    command: ["bash", "-lc", "cd ${CMD_WORKDIR:-/aichallenge} && exec bash -lc \"${CMD:-}\""]

  rosbag:
    <<: *autoware-rosbag-base
    command: ["bash", "-lc", 'exec /aichallenge/utils/record_all_rosbag.bash "${ROS_DOMAIN_ID:-1}" "${LOG_DIR:-}" "${RACING_KART_INTERFACE_DIR:-/home/tier4/racing_kart_interface}"']

  autoware-simulator-evaluation:
    <<: *autoware-base
    image: "aichallenge-2025-eval"
    # /aichallenge is baked into the eval image; intentionally not mounted here.
    volumes:
      - ./output:${OUTPUT_ROOT:-/output}
      - ./vehicle/cyclonedds.xml:/opt/autoware/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
      - ${XAUTHORITY:-/dev/null}:${XAUTHORITY:-/dev/null}:rw
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
    command: ["bash", "-lc", "exec /aichallenge/run_evaluation.bash"]

#### vehicle specific services can be added here ####
  # Zenoh service
  zenoh:
    <<: *autoware-base
    working_dir: /vehicle
    command: ["bash", "-lc", "exec /vehicle/run_zenoh.bash ${VEHICLE_ID:-} ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

  # Driver service
  driver:
    <<: *racing_kart_interface-base
    # Start as root for CAN/DDS host setup; /vehicle/run_driver.bash
    # fixes log ownership back to HOST_UID:HOST_GID.
    user: "root"
    entrypoint: []
    command: ["bash", "-lc", "exec /vehicle/run_driver.bash vehicle ${ROS_DOMAIN_ID:-1} ${LOG_DIR:-}"]

#### remote visualization services ####
  rviz2:
    <<: *autoware-base 
    command: ["bash", "-lc", "exec /aichallenge/utils/run_rviz.bash remote"]
